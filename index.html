<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leaflet Rotate</title>
    
    <!-- 1. Leaflet の CSS と JS （標準機能のみを使用） -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #compass-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 14px 24px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #compass-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        /* 羅針盤（矢印マーカー）のスタイル */
        .compass-arrow {
            font-size: 32px;
            text-align: center;
            line-height: 1;
            transition: transform 0.1s linear; /* 回転を滑らかにする */
        }
    </style>
</head>
<body>

    <button id="compass-btn" onclick="toggleCompass()">🧭 コンパス連動を開始</button>
    <div id="map"></div>

    <script>
        // 1. 地図の初期化
        const map = L.map('map').setView([37.94413,139.33510], 16);

        // 2. 背景地図の追加
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. 矢印マーカー
        const compassIcon = L.divIcon({
            html: '<div id="arrow" class="compass-arrow">⬆️</div>',
            className: 'custom-div-icon',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });
        let marker = null;
        let isTracking = false;

        //
        map.on('locationfound', function(e) {
            const currentPos = e.latlng;

            // 地図の中心を現在地へ移動
            map.setView(currentPos, 16);

            // マーカーがまだ作られていなければ作成、あれば位置を更新
            if (!marker) {
                marker = L.marker(currentPos, { icon: compassIcon }).addTo(map);
            } else {
                marker.setLatLng(currentPos);
            }
        })
        //error
        map.on('locationerror'function(e){
            alert("位置情報の取得に失敗しました:"+e.message);
        });
        
        //
        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading; // iOS
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; // Android
            }

            if (heading !== null) {
                const arrowDiv = document.getElementById('arrow');
                if (arrowDiv) {
                    // CSSのtransformを使って矢印要素だけをスマホの向きに合わせて回転させる
                    arrowDiv.style.transform = `rotate(${heading}deg)`;
                }
            }
        }

        // 5. ボタン連動処理
        function toggleCompass() {
            const btn = document.getElementById('compass-btn');

            if (isTracking) {
                window.removeEventListener('deviceorientation', handleOrientation, true);
                window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
                map.stopLocate();
                
                btn.innerText = '🧭 コンパス連動を開始';
                btn.classList.remove('active');
                
                const arrowDiv = document.getElementById('arrow');
                if (arrowDiv) arrowDiv.style.transform = 'rotate(0deg)';
                isTracking = false;
                return;
            }

            map.locate({setView:true,watch:true,enableHighAccuracy:true});

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startListening();
                        } else {
                            alert('方位情報の取得が拒否されました。');
                        }
                    })
                    .catch(console.error);
            } else {
                startListening();
            }
        }

        function startListening() {
            const btn = document.getElementById('compass-btn');
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
            btn.innerText = '🛑 連動を停止';
            btn.classList.add('active');
            isTracking = true;
        }
    </script>
</body>
</html>
