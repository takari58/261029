<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leaflet スマホ方位角連動</title>
    
    <!-- 1. Leaflet の CSS と JS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <!-- 2. 安定性の高い最新の Leaflet.Rotate プラグイン（最新版に修正） -->
    <script src="https://unpkg.com"></script>

    <style>
        /* 画面いっぱいに地図を表示するための必須設定 */
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* コンパス開始ボタンのスタイル */
        #compass-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000; /* 地図より確実に上に表示 */
            background: white;
            padding: 14px 24px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #compass-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
    </style>
</head>
<body>

    <button id="compass-btn" onclick="toggleCompass()">🧭 コンパス連動を開始</button>
    <div id="map"></div>

    <script>
        // 1. 地図の初期化（rotate: true）
        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: true
        }).setView([35.681236, 139.767125], 16); // 東京駅周辺

        // 2. 背景地図（OpenStreetMap）の追加
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; FullOSM'
        }).addTo(map);

        // 3. 中心にマーカーを設置
        L.marker([35.681236, 139.767125]).addTo(map);

        let isTracking = false;

        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; 
            }

            if (heading !== null) {
                map.setBearing(heading);
            }
        }

        function toggleCompass() {
            const btn = document.getElementById('compass-btn');

            if (isTracking) {
                window.removeEventListener('deviceorientation', handleOrientation, true);
                window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
                btn.innerText = '🧭 コンパス連動を開始';
                btn.classList.remove('active');
                map.setBearing(0);
                isTracking = false;
                return;
            }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startListening();
                        } else {
                            alert('方位情報の取得が拒否されました。');
                        }
                    })
                    .catch(console.error);
            } else {
                startListening();
            }
        }

        function startListening() {
            const btn = document.getElementById('compass-btn');
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
            btn.innerText = '🛑 連動を停止';
            btn.classList.add('active');
            isTracking = true;
        }
    </script>
</body>
</html>
